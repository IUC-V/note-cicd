
version: 0.2

phases:
  install:
    runtime-versions:
      nodejs: 22
    commands:
      - echo "Installing dependencies"
      - npm ci

  build:
    commands:
      - echo "Running application tests"
      - npm test

  post_build:
    commands:
      - echo "Build and test completed"

artifacts:
  files:
    - '**/*'
  discard-paths: no
